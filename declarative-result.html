<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebMCP Demo - Declarative Result</title>
    <script id="msg-1" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Message",
        "text": "Procesando tool..."
      }
    </script>
    <script id="msg-2" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Message",
        "text": "[]"
      }
    </script>
  </head>
  <body>
    <main style="font-family: Segoe UI, Aptos, sans-serif; padding: 1rem; max-width: 900px; margin: 0 auto;">
      <h1>Resultado declarativo</h1>
      <p>Esta pagina responde a tools declarativas y persiste estado en localStorage.</p>
      <pre id="debug" style="background:#111414;color:#dce5e5;border-radius:8px;padding:0.8rem;overflow:auto;"></pre>
      <p><a href="./declarative.html">Volver a declarative.html</a></p>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const tool = params.get("tool");
      const storageKey = "webmcp_declarative_tasks";
      const debugEl = document.getElementById("debug");

      function readTasks() {
        try {
          const raw = localStorage.getItem(storageKey);
          const parsed = raw ? JSON.parse(raw) : [];
          return Array.isArray(parsed) ? parsed : [];
        } catch {
          return [];
        }
      }

      function writeTasks(tasks) {
        localStorage.setItem(storageKey, JSON.stringify(tasks));
      }

      function nextId(tasks) {
        return tasks.reduce((max, t) => Math.max(max, Number(t.id) || 0), 0) + 1;
      }

      function setMessage(scriptId, text) {
        const el = document.getElementById(scriptId);
        el.textContent = JSON.stringify(
          {
            "@context": "https://schema.org",
            "@type": "Message",
            text
          },
          null,
          2
        );
      }

      const tasks = readTasks();
      let message = "Sin operacion.";

      if (tool === "add_task") {
        const title = String(params.get("title") || "").trim();
        if (!title) {
          message = "Error: title es obligatorio.";
        } else {
          const created = { id: nextId(tasks), title, done: false };
          tasks.push(created);
          writeTasks(tasks);
          message = `Tarea creada: #${created.id} "${created.title}"`;
        }
      } else if (tool === "complete_task") {
        const id = Number(params.get("id"));
        const task = tasks.find((t) => Number(t.id) === id);
        if (!task) {
          message = `Error: no existe la tarea #${params.get("id") || "?"}.`;
        } else {
          task.done = true;
          writeTasks(tasks);
          message = `Tarea completada: #${task.id}`;
        }
      } else if (tool === "list_tasks") {
        message = `Listado actualizado: ${tasks.length} tarea(s).`;
      }

      const openTasks = tasks.filter((t) => !t.done);
      setMessage("msg-1", message);
      setMessage("msg-2", JSON.stringify(openTasks));

      debugEl.textContent = JSON.stringify(
        {
          tool,
          message,
          openTasks,
          allTasks: tasks
        },
        null,
        2
      );
    </script>
  </body>
</html>
